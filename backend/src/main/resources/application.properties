spring.application.name=EcoGestion

# Servidor (Railway asigna el puerto en la variable PORT)
server.port=${PORT:8080}
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=60m

# MongoDB (en Railway: MONGO_URL la entrega el servicio de base de datos)
spring.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/ecogestion}
spring.mongodb.database=${MONGO_DATABASE:ecogestion}
spring.data.mongodb.auto-index-creation=true

# Subida de fotos (máximo 5 fotos de 5 MB por solicitud)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Correo SMTP (opcional): definir SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD y NOTIFICACIONES_CANAL=correo. Sin ellas, las notificaciones se registran en el log.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator: solo salud para Railway (no depende del servidor de correo)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Parámetros propios de EcoGestión
ecogestion.notificaciones.canal=${NOTIFICACIONES_CANAL:registro}
ecogestion.notificaciones.remitente=${NOTIFICACIONES_REMITENTE:no-responder@ecogestion.co}
ecogestion.notificaciones.reintentos=3
ecogestion.mapas.google-api-key=${GOOGLE_MAPS_API_KEY:}
ecogestion.duplicados.radio-metros=50
ecogestion.seguridad.intentos-maximos=5
ecogestion.seguridad.minutos-bloqueo=15
ecogestion.admin.correo=${ADMIN_CORREO:}
ecogestion.admin.contrasena=${ADMIN_CONTRASENA:}
ecogestion.datos-demo=${DATOS_DEMO:true}
# Límites aproximados del municipio de Pasto (HU-04)
ecogestion.municipio.latitud-min=1.10
ecogestion.municipio.latitud-max=1.32
ecogestion.municipio.longitud-min=-77.40
ecogestion.municipio.longitud-max=-77.18
