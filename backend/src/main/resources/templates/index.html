<!DOCTYPE html>
<!--
  Página de inicio (pública).
  - Iniciar sesión: después lleva a la página del rol (ciudadano, administrador u operador). HU-01
  - Registrarse como ciudadano. HU-01
  - Consultas públicas: horarios y rutas por sector o barrio con su recorrido en el mapa (HU-12),
    puntos de recolección en el mapa (HU-13) y educación ambiental por categoría y palabra (HU-14).
  La lógica está en /js/inicio.js.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Inicio')}"></head>
<body>
<div class="portada">
    <h1>EcoGestión</h1>
    <div>Reporte y gestión de residuos sólidos en Pasto (Nariño)</div>
</div>

<main>
    <div class="columnas">
        <section>
            <h2>Iniciar sesión</h2>
            <form id="formLogin">
                <label for="loginCorreo">Correo</label>
                <input id="loginCorreo" type="email" required>
                <label for="loginContrasena">Contraseña</label>
                <input id="loginContrasena" type="password" required>
                <button type="submit">Entrar</button>
            </form>
            <div id="msgLogin" class="mensaje"></div>
        </section>

        <section>
            <h2>Crear cuenta de ciudadano</h2>
            <form id="formRegistro">
                <div class="fila">
                    <div><label for="regNombre">Nombre completo</label><input id="regNombre" required></div>
                    <div><label for="regDocumento">Documento</label><input id="regDocumento" required></div>
                </div>
                <label for="regCorreo">Correo</label>
                <input id="regCorreo" type="email" required>
                <label for="regContrasena">Contraseña (mínimo 8 caracteres, con letras y números)</label>
                <input id="regContrasena" type="password" required>
                <label for="regSector">Sector donde vive (opcional)</label>
                <select id="regSector"></select>
                <button type="submit">Registrarme</button>
            </form>
            <div id="msgRegistro" class="mensaje"></div>
        </section>
    </div>

    <section>
        <h2>Horarios y rutas de recolección por sector o barrio</h2>
        <div class="fila">
            <div><label for="buscarSector">Sector o barrio</label><input id="buscarSector" placeholder="Ej.: Centro o Torobajo"></div>
            <div style="flex:0"><button type="button" onclick="pagina.verHorarios()">Consultar</button></div>
        </div>
        <div id="msgHorarios" class="mensaje"></div>
        <div id="horarios"></div>
        <div id="mapaRutas" class="mapa pequeno"></div>
    </section>

    <section>
        <h2>Puntos de recolección autorizados</h2>
        <div class="fila">
            <div>
                <label for="filtroMaterial">Material</label>
                <select id="filtroMaterial" onchange="pagina.verPuntos()">
                    <option value="">Todos</option>
                    <option th:each="m : ${materiales}" th:value="${m}" th:text="${m}">MATERIAL</option>
                </select>
            </div>
        </div>
        <div id="mapaPuntos" class="mapa"></div>
        <div id="puntos"></div>
    </section>

    <section>
        <h2>Educación ambiental</h2>
        <div class="fila">
            <div>
                <label for="filtroCategoria">Categoría</label>
                <select id="filtroCategoria" onchange="pagina.verContenidos()">
                    <option value="">Todas</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">CATEGORIA</option>
                </select>
            </div>
            <div><label for="buscarContenido">Buscar por palabra</label><input id="buscarContenido" placeholder="Ej.: pilas"></div>
            <div style="flex:0"><button type="button" onclick="pagina.verContenidos()">Buscar</button></div>
        </div>
        <div id="contenidos"></div>
    </section>
</main>

<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
